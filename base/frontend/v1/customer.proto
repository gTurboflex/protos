syntax = "proto3";

package user.base.frontend.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gTurboflex/protos/base/frontend/v1;base";

message Customer {
  uint64 id = 1;
  string name = 2;

  string email = 3;

  string phone = 4;

  google.protobuf.Timestamp created_at = 5;

  google.protobuf.Timestamp updated_at = 6;

  bool is_deleted = 7;
}
