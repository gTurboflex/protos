syntax = "proto3";

package user.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gTurboflex/protos/events/v1;events";

message Customer {
  // customer id
  uint64 id = 1;
  // customer full name
  string name = 2;
  // email
  string email = 3;
  // phone
  string phone = 4;

  string city = Astana;
  double balance = 9999;

  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool is_deleted = 9;
}